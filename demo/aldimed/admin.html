<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Админ-панель · ALDIMED</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#08193a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0b56c9;--blue2:#2a7ef0;--navy:#08193a;--ink:#0d1c33;--mute:#5a6a82;--sky:#f1f6ff;--sky2:#e3eeff;--line:#dce6f4;--ok:#11a683;--warn:#e9962b;--bad:#d23c3c;--f:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 var(--f);color:var(--ink);background:#f4f7fc;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none;background:var(--sky);color:var(--blue)}
.btn:hover{background:var(--sky2)}
.btn.main{background:var(--blue);color:#fff}.btn.main:hover{background:#0a4bb0}
.btn.ok{background:#e6f8f1;color:#0a7d62}.btn.bad{background:#fdecec;color:var(--bad)}.btn.wa{background:#1fb85a;color:#fff}
.btn.sm{height:34px;padding:0 11px;border-radius:10px;font-size:13px}
.btn.line{background:#fff;border-color:var(--line);color:var(--ink)}
input,select,textarea{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;outline:0}
textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#5aa2ff;box-shadow:0 0 0 3px rgba(42,126,240,.14)}
label.f{display:block;font-weight:600;font-size:13px;color:#2b3a52;margin:12px 0 6px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);vertical-align:middle}
.login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(800px 500px at 80% 0,#dbe9ff,transparent 60%),#f4f7fc}
.login form{background:#fff;border-radius:24px;padding:34px;width:min(400px,100%);box-shadow:0 30px 80px -40px rgba(11,40,96,.5);border:1px solid var(--line)}
.login .lg{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.login .hint{font-size:13px;color:var(--mute);margin-top:14px;background:var(--sky);padding:10px 12px;border-radius:10px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100dvh}
.side{background:var(--navy);color:#c6d4ee;padding:22px 14px;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px}
.side .lg{display:flex;gap:10px;align-items:center;padding:4px 10px 22px;color:#fff}
.side .lg b{font-size:18px;letter-spacing:.02em}.side .lg small{display:block;font-size:11.5px;color:#9fb1d1}
.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600}
.side button:hover{background:rgba(255,255,255,.06)}.side button.on{background:rgba(90,162,255,.18);color:#fff}
.side button em{margin-left:auto;font-style:normal;background:#ff7a45;color:#fff;font-size:12px;border-radius:99px;padding:1px 8px}
.side .sp{flex:1}.side a{color:#c6d4ee;text-decoration:none;padding:10px 12px;border-radius:12px;font-weight:600;font-size:14px}.side a:hover{background:rgba(255,255,255,.06)}
.content{padding:28px 32px 80px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:28px;font-weight:800}
.demo{background:#fff8ec;border:1px solid #f6e2bd;color:#6d4b10;border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--blue);line-height:1.1}.kpi span{color:var(--mute);font-size:13.5px}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:18px}
.panel h2{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
.chips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bk{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}
.bk .dt b{display:block;font-size:16px}.bk .dt small{color:var(--mute)}
.bk .who b{font-weight:700}.bk .who small{display:block;color:var(--mute)}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;margin-left:6px;vertical-align:1px}
.st.new{background:#fff1ea;color:#d4581f}.st.confirmed{background:#e6f8f1;color:#0a7d62}.st.moved{background:#eef3ff;color:#2a5bc4}.st.came{background:#e9f6ff;color:#0c6aa8}.st.cancel{background:#f1f2f4;color:#6b7280}
.resched{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}.resched.on{display:flex}.resched input{width:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input{height:38px}
.tbl .num{width:130px}
.tbl .c{width:56px;text-align:center}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dc{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:#fff}
.dc .av{width:54px;height:54px;border-radius:16px;background:linear-gradient(140deg,#5aa2ff,var(--blue));color:#fff;font-weight:800;display:grid;place-items:center;overflow:hidden;flex:none}
.dc .av img{width:100%;height:100%;object-fit:cover}
.dc b{display:block}.dc small{color:var(--mute)}.dc .off{opacity:.45}
.dc .a{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.hrow{display:grid;grid-template-columns:60px 1fr 1fr 110px;gap:10px;align-items:center;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(8,25,58,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:22px;width:min(560px,100%);max-height:calc(100dvh - 36px);overflow:auto;padding:24px}
.modal .box h3{font-size:20px;margin-bottom:6px}
.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;font-weight:600;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.mtabs{display:none}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}.content{padding:16px 14px 90px}
 .mtabs{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;z-index:20;background:#f4f7fc;padding:10px 14px;margin:0 -14px 14px;border-bottom:1px solid var(--line)}
 .mtabs button{flex:none;height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px}
 .mtabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
 .cards{grid-template-columns:1fr 1fr}.bk{grid-template-columns:1fr}.bk .acts{justify-content:flex-start}.grid2{grid-template-columns:1fr}
 .tbl thead{display:none}.tbl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}.tbl td{border:0;padding:0}.tbl td.nm{grid-column:1/-1}.tbl .num{width:100%}.tbl td.c{display:flex;align-items:center;gap:8px;width:auto;text-align:left}.tbl td[data-l]::after{content:attr(data-l);font-size:13px;color:var(--mute)}
 .hrow{grid-template-columns:44px 1fr 1fr 90px}
}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="login" id="login">
 <form id="lf" autocomplete="off">
  <div class="lg"><svg width="44" height="44" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#0b56c9"/><path d="M12 24.5 24 13l12 11.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 22v12.5h17V22" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M24 23.5v8M20 27.5h8" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg><div><h1 style="font-size:22px">ALDIMED</h1><small style="color:var(--mute)">Панель управления сайтом</small></div></div>
  <label class="f" for="pwd">Пароль</label>
  <input id="pwd" type="password" autocomplete="current-password" placeholder="••••••••">
  <div id="lerr" style="color:var(--bad);font-size:13px;min-height:20px;margin-top:6px"></div>
  <button class="btn main" style="width:100%;height:48px;margin-top:6px">Войти</button>
  <div class="hint">Демо-доступ: пароль <b>aldimed2026</b></div>
 </form>
</div>

<div class="app" id="app" hidden>
 <aside class="side" id="side"></aside>
 <main class="content">
  <div class="mtabs" id="mtabs"></div>
  <div id="view"></div>
 </main>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
(function(){
var S=window.AStore,$=function(id){return document.getElementById(id)},esc=S.esc,D=S.load();
var HASH='93a003832b906d253042645bf6f55b88ba51bdd88f2632f859747096bac248c6',AK='aldimed_admin_auth';
var STATUS={new:'Новая',confirmed:'Подтверждена',moved:'Перенесена',came:'Пришёл',cancel:'Отменена'};
var DAYN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('on')},1800)}
function save(msg){S.save(D);toast(msg||'Сохранено — изменения уже на сайте')}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function authed(){try{return localStorage.getItem(AK)===HASH}catch(e){return false}}
$('lf').onsubmit=async function(e){e.preventDefault();var h=await sha($('pwd').value.trim());if(h===HASH){try{localStorage.setItem(AK,HASH)}catch(x){}start()}else{$('lerr').textContent='Неверный пароль'}};

/* демо-заявки, чтобы панель не была пустой */
function seed(){
 try{if(localStorage.getItem('aldimed_seeded'))return;localStorage.setItem('aldimed_seeded','1')}catch(e){return}
 if(S.bookings().length)return;
 var n=S.now(),d=function(k){var x=new Date(n.getFullYear(),n.getMonth(),n.getDate()+k);while(!D.settings.hours[x.getDay()])x.setDate(x.getDate()+1);return S.ymd(x)};
 var mk=function(o){o.id=S.uid();o.created=new Date(Date.now()-Math.random()*864e5).toISOString();o.source=o.source||'сайт';o.demo=true;return o};
 S.saveBookings([
  mk({status:'new',cat:'uzi',item:'u9',label:'УЗИ органов малого таза',date:d(1),time:'10:30',name:'Айгерим (пример)',phone:'77010000001',note:'Акция «Женское здоровье»',promo:'Женское здоровье — неделя заботы о себе'}),
  mk({status:'new',cat:'doc',item:'d4',label:'Приём: Кабилдин Куан Советович (уролог, уролог-андролог)',date:d(1),time:'15:00',name:'Ерлан (пример)',phone:'77020000002',note:''}),
  mk({status:'confirmed',cat:'uzi',item:'u18',label:'УЗИ 3D / 4D — Увидеть малыша в объёме и в движении',date:d(2),time:'11:00',name:'Мадина (пример)',phone:'77050000003',note:'24 недели'}),
  mk({status:'came',cat:'doc',item:'d8',label:'Приём: Ященко Наталья Юрьевна (дерматолог, трихолог, косметолог)',date:d(0),time:'09:30',name:'Ольга (пример)',phone:'77770000004',note:'Выпадение волос',source:'телефон'})
 ]);
}

var TABS=[['dash','Обзор'],['book','Заявки'],['pat','Пациенты'],['docs','Врачи'],['price','Услуги и цены'],['promo','Акции'],['set','Настройки'],['data','Данные']];
var cur='dash';
function nav(){
 var nNew=S.bookings().filter(function(b){return b.status==='new'}).length;
 $('side').innerHTML='<div class="lg"><svg width="38" height="38" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#2a7ef0"/><path d="M12 24.5 24 13l12 11.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 22v12.5h17V22" fill="none" stroke="#fff" stroke-width="2.8" stroke-linejoin="round"/><path d="M24 23.5v8M20 27.5h8" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg><span><b>ALDIMED</b><small>панель управления</small></span></div>'+
  TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+(t[0]==='book'&&nNew?'<em>'+nNew+'</em>':'')+'</button>'}).join('')+
  '<span class="sp"></span><a href="./" target="_blank" rel="noopener">↗ Открыть сайт</a><a href="#" id="logout">Выйти</a>';
 $('mtabs').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(cur===t[0]?'on':'')+'">'+t[1]+(t[0]==='book'&&nNew?' ('+nNew+')':'')+'</button>'}).join('')+'<button onclick="window.open(\'./\')">Сайт ↗</button>';
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-t]');if(b&&(b.closest('#side')||b.closest('#mtabs'))){cur=b.dataset.t;render();scrollTo(0,0)}if(e.target.id==='logout'){e.preventDefault();try{localStorage.removeItem(AK)}catch(x){}location.reload()}});
function render(){nav();({dash:vDash,book:vBook,pat:vPat,docs:vDocs,price:vPrice,promo:vPromo,set:vSet,data:vData})[cur]()}
function top(t,extra){return '<div class="top"><h1>'+t+'</h1><div style="display:flex;gap:8px;flex-wrap:wrap">'+(extra||'')+'</div></div>'}
var demoNote='<div class="demo"><b>Демо-режим.</b> Всё, что вы меняете, сохраняется в этом браузере и сразу видно на <a href="./" target="_blank" style="font-weight:700">сайте</a> (откройте в этом же браузере). В рабочей версии данные хранятся в облаке, а новые заявки приходят регистратору в WhatsApp и Telegram.</div>';

/* ---------- Обзор ---------- */
function vDash(){
 var bs=S.bookings(),today=S.ymd(S.now());
 var pats={};bs.forEach(function(b){pats[b.phone]=1});
 var up=bs.filter(function(b){return b.date>=today&&b.status!=='cancel'}).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}).slice(0,6);
 $('view').innerHTML=top('Обзор','<button class="btn main" id="addB">+ Записать пациента</button>')+demoNote+
 '<div class="cards"><div class="kpi"><b>'+bs.filter(function(b){return b.status==='new'}).length+'</b><span>новых заявок</span></div><div class="kpi"><b>'+bs.filter(function(b){return b.date===today&&b.status!=='cancel'}).length+'</b><span>записей на сегодня</span></div><div class="kpi"><b>'+bs.length+'</b><span>заявок всего</span></div><div class="kpi"><b>'+Object.keys(pats).length+'</b><span>пациентов в базе</span></div></div>'+
 '<div class="panel"><h2>Ближайшие записи<button class="btn sm" data-t2="book">Все заявки →</button></h2>'+(up.length?up.map(bkRow).join(''):'<div class="empty">Пока нет записей</div>')+'</div>'+
 '<div class="panel"><h2>Быстрые действия</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-t2="price">Изменить цены</button><button class="btn" data-t2="docs">Добавить врача</button><button class="btn" data-t2="promo">Запустить акцию</button><button class="btn" data-t2="set">График и объявление</button></div></div>';
 wireBk();$('addB').onclick=function(){bookForm()};
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-t2]');if(b){cur=b.dataset.t2;render();scrollTo(0,0)}});

/* ---------- Заявки ---------- */
var bf='all',bq='';
function waPatient(b,kind){
 var dt=b.date?S.fmtDate(b.date)+' ('+DAYN[new Date(b.date+'T00:00:00').getDay()].toLowerCase()+')'+(b.time?' в '+b.time:''):'';
 var t=kind==='confirm'?'Здравствуйте, '+b.name.replace(/ \(пример\)/,'')+'! Это медицинский центр ALDIMED. Подтверждаем вашу запись: '+b.label+', '+dt+'. Адрес: Караганда, Гоголя, 57. Ждём вас!'
  :kind==='move'?'Здравствуйте, '+b.name.replace(/ \(пример\)/,'')+'! Это медицинский центр ALDIMED. Ваша запись перенесена: '+b.label+' — новое время: '+dt+'. Если не подходит — ответьте на это сообщение, подберём другое.'
  :kind==='cancel'?'Здравствуйте, '+b.name.replace(/ \(пример\)/,'')+'! Это медицинский центр ALDIMED. К сожалению, запись на '+dt+' отменена. Напишите, и мы подберём удобное время.'
  :'Здравствуйте, '+b.name.replace(/ \(пример\)/,'')+'! Это медицинский центр ALDIMED.';
 return S.wa(b.phone,t);
}
function bkRow(b){
 var dd=b.date?new Date(b.date+'T00:00:00'):null;
 return '<div class="bk" data-id="'+b.id+'"><div class="dt"><b>'+(b.date?S.fmtDate(b.date):'Без даты')+'</b><small>'+(dd?DAYN[dd.getDay()]+' · ':'')+(b.time||'время не выбрано')+'</small></div>'+
 '<div class="who"><b>'+esc(b.name)+'</b><span class="st '+b.status+'">'+STATUS[b.status]+'</span><small>'+esc(b.label)+'</small><small>+'+esc(b.phone)+(b.note?' · «'+esc(b.note)+'»':'')+(b.source&&b.source!=='сайт'?' · '+esc(b.source):'')+'</small>'+
 '<div class="resched"><input type="date" class="rd" value="'+(b.date||'')+'"><input type="time" class="rt" value="'+(b.time||'')+'" step="1800"><button class="btn sm main" data-a="movego">Перенести и написать</button></div></div>'+
 '<div class="acts">'+(b.status==='new'||b.status==='moved'?'<button class="btn sm ok" data-a="confirm">✓ Подтвердить</button>':'')+
 '<button class="btn sm line" data-a="move">Перенести</button>'+(b.status!=='came'?'<button class="btn sm line" data-a="came">Пришёл</button>':'')+
 '<a class="btn sm wa" href="'+waPatient(b,'')+'" target="_blank" rel="noopener">WhatsApp</a>'+(b.status!=='cancel'?'<button class="btn sm bad" data-a="cancel">Отменить</button>':'<button class="btn sm bad" data-a="del">Удалить</button>')+'</div></div>';
}
function wireBk(){
 document.querySelectorAll('.bk [data-a]').forEach(function(btn){btn.onclick=function(){
  var row=btn.closest('.bk'),id=row.dataset.id,bs=S.bookings(),b=bs.filter(function(x){return x.id===id})[0];if(!b)return;var a=btn.dataset.a;
  if(a==='move'){row.querySelector('.resched').classList.toggle('on');return}
  if(a==='movego'){var nd=row.querySelector('.rd').value,nt=row.querySelector('.rt').value;if(!nd)return toast('Выберите дату');b.date=nd;b.time=nt;b.status='moved';S.saveBookings(bs);window.open(waPatient(b,'move'),'_blank');toast('Перенесено — сообщение пациенту открыто');return render()}
  if(a==='confirm'){b.status='confirmed';S.saveBookings(bs);window.open(waPatient(b,'confirm'),'_blank');toast('Подтверждено — сообщение пациенту открыто');return render()}

 '<div style="display:flex;gap:10px"><button class="btn main" id="sSave" style="height:48px;padding:0 26px">Сохранить настройки</button><a class="btn line" href="./" target="_blank" style="height:48px">Посмотреть на сайте ↗</a></div>';
 document.querySelectorAll('[data-off]').forEach(function(c){c.onchange=function(){var d=c.dataset.off;document.querySelectorAll('[data-h="'+d+'"]').forEach(function(i){i.disabled=c.checked;if(!c.checked&&!i.value)i.value=i.dataset.i==='0'?'08:00':'18:00'})}});
 $('sSave').onclick=function(){
  s.notice.on=$('nOn').checked;s.notice.text=$('nT').value.trim();
  [0,1,2,3,4,5,6].forEach(function(d){var off=document.querySelector('[data-off="'+d+'"]').checked,a=document.querySelector('[data-h="'+d+'"][data-i="0"]').value,b=document.querySelector('[data-h="'+d+'"][data-i="1"]').value;s.hours[d]=off||!a||!b?null:[a,b]});
  s.wa=S.normPhone($('sWa').value)||s.wa;s.instagram=$('sIg').value.replace(/^@/,'').trim();
  document.querySelectorAll('[data-ph]').forEach(function(i){s.phones[+i.dataset.ph][i.dataset.k]=i.value.trim()});
  s.address=$('sAd').value.trim();s.addressNote=$('sAn').value.trim();D.hero.title=$('hT').value.trim();D.hero.text=$('hX').value.trim();s.rating=$('sR').value.trim();s.ratingCount=$('sRc').value.trim();
  save();
 };
}

/* ---------- Данные ---------- */
function vData(){
 $('view').innerHTML=top('Данные')+
 '<div class="panel"><h2>Резервная копия</h2><p style="color:var(--mute);margin:0 0 12px">Скачайте все данные сайта (врачи, цены, акции, настройки, заявки) одним файлом или загрузите копию обратно.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn main" id="exp">Скачать копию</button><label class="btn line" style="cursor:pointer">Загрузить копию<input type="file" id="imp" accept="application/json" hidden></label></div></div>'+
 '<div class="panel"><h2>Сброс демо</h2><p style="color:var(--mute);margin:0 0 12px">Вернуть сайт к исходным данным и очистить заявки.</p><button class="btn bad" id="rst">Сбросить всё</button></div>';
 $('exp').onclick=function(){var blob=new Blob([JSON.stringify({site:D,bookings:S.bookings(),notes:S.notes()},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aldimed-backup-'+S.ymd(S.now())+'.json';a.click()};
 $('imp').onchange=function(){var f=this.files[0];if(!f)return;f.text().then(function(t){try{var j=JSON.parse(t);if(!j.site||!j.site.settings)throw 0;D=j.site;S.save(D);S.saveBookings(j.bookings||[]);S.saveNotes(j.notes||{});toast('Копия загружена');render()}catch(e){toast('Файл не подходит')}})};
 $('rst').onclick=function(){if(!confirm('Сбросить все изменения и заявки?'))return;S.reset();S.saveBookings([]);S.saveNotes({});try{localStorage.removeItem('aldimed_seeded')}catch(e){}D=S.load();toast('Демо сброшено');seed();render()};
}

function start(){$('login').hidden=true;$('app').hidden=false;seed();render()}
if(authed())start();
})();
</script>
</body>
