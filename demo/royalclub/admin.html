<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель — Royal Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#6e1232;--deep:#2a0712;--deep2:#1a040b;--aqua:#2fb9c4;--ink:#1d1418;--mute:#6f6066;--soft:#f6f1f3;--line:#eadfe3}
*{box-sizing:border-box;min-width:0}
body{margin:0;font:15px/1.5 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--soft)}
h1,h2{font-family:Unbounded,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.b-wine{background:var(--wine);color:#fff}.b-aqua{background:var(--aqua);color:#04262a}.b-ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}.b-del{background:#fbe9eb;color:#b3261e}
.login{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 90% at 85% 0%,#7d1a3d 0%,var(--deep) 55%,var(--deep2) 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{background:#fff;border-radius:24px;padding:32px;width:100%;max-width:380px;display:grid;gap:12px}
.lbox p{margin:0;color:var(--mute)}
.lbox input{min-height:52px;border-radius:12px;border:1px solid var(--line);padding:0 14px;font-size:16px}
.lerr{color:#b3261e;min-height:20px;font-size:14px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.top{background:var(--deep2);color:#fff;display:flex;align-items:center;gap:14px;padding:12px max(3vw,14px);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.top b{font-family:Unbounded,sans-serif;font-size:15px}
.top .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:20px max(3vw,14px);max-width:1300px;margin:0 auto}
@media(max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.side{display:flex;overflow-x:auto;gap:6px}.side button{flex:none}}
.side{display:grid;gap:4px;align-content:start}
.side button{text-align:left;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;font-weight:600;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px}
.side button[aria-current=true]{background:#fff;color:var(--wine);box-shadow:0 1px 0 var(--line)}
.side i{font-style:normal;background:var(--wine);color:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.panel{background:#fff;border-radius:20px;padding:24px}
.panel h2{font-size:20px;margin-bottom:6px}.panel>p{color:var(--mute);margin:0 0 18px}
.item{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.item .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--mute)}
input,select,textarea{min-height:44px;border-radius:10px;border:1px solid var(--line);padding:8px 12px;font-size:15px;color:var(--ink);background:#fff;width:100%}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--deep2);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:50}
.toast.on{transform:translateX(-50%)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute)}
.st{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}.st-new{background:#e6f7f8;color:#0f6f78}.st-done{background:#eee;color:#555}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--soft)}
@media(max-width:600px){thead{display:none}tr{display:grid;padding:10px 0;border-bottom:1px solid var(--line)}td{border:0;padding:3px 0}}
</style>
</head>
<body>
<div class="login" id="login">
 <form class="lbox" id="loginForm" autocomplete="off">
  <h1 style="font-size:22px">Royal Club · админ-панель</h1>
  <p>Введите пароль, чтобы войти</p>
  <input id="pwd" type="password" placeholder="Пароль" autocomplete="current-password">
  <div class="lerr" id="lerr"></div>
  <button class="btn b-wine" type="submit" style="justify-content:center">Войти</button>
 </form>
</div>

<div class="top"><b>ROYAL CLUB · Админ-панель</b>
 <div class="sp"><a class="btn b-aqua" href="index.html" target="_blank">Открыть сайт</a><button class="btn b-ghost" id="logout">Выйти</button></div>
</div>
<div class="layout">
 <nav class="side" id="side"></nav>
 <main class="panel" id="panel"></main>
</div>
<div class="toast" id="toast">Сохранено — сайт обновлён</div>

<script src="js/data.js"></script>
<script>
{
const HASH='6c3cd9c1436264191e7512d3f872b2209fd987c60c8464dec27c1744bc3c6ea7',AK='royalclub_admin_auth';
const $=id=>document.getElementById(id),e=RC.esc;
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const authed=()=>{try{return localStorage.getItem(AK)===HASH}catch(x){return false}};
if(authed())$('login').style.display='none';else setTimeout(()=>$('pwd').focus(),50);
$('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const v=$('pwd').value;if(!v){$('lerr').textContent='Введите пароль';return}
 const h=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
 if(h===HASH){try{localStorage.setItem(AK,HASH)}catch(x){}$('login').style.display='none';$('lerr').textContent=''}
 else{$('lerr').textContent='Неверный пароль';const b=$('loginForm');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}});
$('logout').onclick=()=>{try{localStorage.removeItem(AK)}catch(x){}$('pwd').value='';$('login').style.display='flex'};

let D=RC.load();
const toast=t=>{$('toast').textContent=t||'Сохранено — сайт обновлён';$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1800)};

const LISTS={
 clubs:{t:'Клубы',p:'Адреса и описание клубов на сайте.',f:[['name','Название'],['address','Адрес'],['hours','Режим работы'],['note','Что есть в клубе','full']],blank:{name:'',address:'',hours:'',note:''}},
 cards:{t:'Карты и цены',p:'Укажите цену — она сразу появится на сайте. Пустая цена = «по запросу».',f:[['name','Название'],['price','Цена, ₸'],['period','Срок'],['theme','Цвет','sel',['platinum','gold','day','kids','corp']],['text','Описание','area'],['perks','Что входит (через ;)','area']],blank:{name:'',price:'',period:'',theme:'gold',text:'',perks:''}},
 schedule:{t:'Расписание',p:'Добавляйте и удаляйте занятия — сайт обновится сразу.',f:[['cat','Направление','sel',['Групповые','Водные','Детские','Игровые']],['time','Время'],['name','Занятие'],['club','Клуб','club'],['dur','Длительность']],blank:{cat:'Групповые',time:'09:00',name:'',club:'',dur:'55 мин'}},
 trainers:{t:'Тренеры',p:'Фото — ссылка на изображение.',f:[['name','Имя'],['role','Должность'],['img','Фото (ссылка)','img']],blank:{name:'',role:'',img:''}},
 zones:{t:'Фото зон',p:'Большие фото на сайте.',f:[['title','Заголовок'],['text','Подпись'],['img','Фото (ссылка)','img']],blank:{title:'',text:'',img:''}},
 faq:{t:'Вопросы',p:'Частые вопросы внизу сайта.',f:[['q','Вопрос','full'],['a','Ответ','area']],blank:{q:'',a:''}}
};
const TABS=[['bookings','Заявки'],['settings','Контакты'],['promo','Акция'],...Object.entries(LISTS).map(([k,v])=>[k,v.t])];
let cur='bookings';
const side=()=>{const n=RC.bookings().filter(b=>b.status==='new').length;$('side').innerHTML=TABS.map(([k,t])=>`<button data-k="${k}" aria-current="${k===cur}">${t}${k==='bookings'&&n?`<i>${n}</i>`:''}</button>`).join('')};
$('side').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;cur=b.dataset.k;render()});

const field=(k,v,f,i)=>{const [key,lab,type,opts]=f,id=`${k}-${i}-${key}`,val=e(v[key]??'');
 const cls=type==='full'||type==='area'||type==='img'?' class="full"':'';
 let inp;
 if(type==='sel')inp=`<select data-key="${key}">${opts.map(o=>`<option ${o===v[key]?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(type==='club')inp=`<select data-key="${key}">${D.clubs.map(c=>`<option ${c.name===v[key]?'selected':''}>${e(c.name)}</option>`).join('')}</select>`;
 else if(type==='area')inp=`<textarea data-key="${key}">${val}</textarea>`;
 else inp=`<input data-key="${key}" value="${val}">`;
 return `<label${cls}>${lab}${inp}</label>${type==='img'&&v[key]?`<img class="thumb" src="${val}" alt="">`:''}`;};

function render(){
 side();const P=$('panel');
 if(cur==='bookings'){const L=RC.bookings();
  P.innerHTML=`<h2>Заявки с сайта</h2><p>Заявки на пробную тренировку. В рабочей версии они сразу приходят администратору в WhatsApp или Telegram.</p>`+
  (L.length?`<table><thead><tr><th>Дата</th><th>Клиент</th><th>Клуб и направление</th><th>Статус</th><th></th></tr></thead><tbody>${L.map((b,i)=>`<tr><td>${new Date(b.date).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td><b>${e(b.name||'Без имени')}</b><br><a href="tel:${e(b.phone)}">${e(b.phone)}</a></td><td>${e(b.club)}<br><span style="color:var(--mute)">${e(b.dir)}</span></td><td><span class="st st-${b.status==='new'?'new':'done'}">${b.status==='new'?'Новая':'Обработана'}</span></td><td><div class="row" style="margin:0"><a class="btn b-aqua" href="${e(RC.wa(b.phone,'Здравствуйте, '+(b.name||'')+'! Это Royal Club, по вашей заявке на пробную тренировку.'))}" target="_blank">WhatsApp</a><button class="btn b-ghost" data-done="${i}">${b.status==='new'?'Готово':'Вернуть'}</button></div></td></tr>`).join('')}</tbody></table>`:`<div class="empty">Заявок пока нет. Оставьте заявку на сайте — она появится здесь.</div>`);
  P.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const L2=RC.bookings(),x=L2[+b.dataset.done];x.status=x.status==='new'?'done':'new';RC.saveBookings(L2);render()});return}
 if(cur==='settings'||cur==='promo'){
  const F=cur==='settings'?[['phone','Телефон'],['wa','WhatsApp (только цифры)'],['instagram','Instagram'],['rating','Рейтинг 2ГИС'],['reviews','Оценок в 2ГИС'],['app','Ссылка на приложение','full']]:[['title','Заголовок','full'],['text','Текст','area']];
  const obj=D[cur];
  P.innerHTML=`<h2>${cur==='settings'?'Контакты и рейтинг':'Баннер акции'}</h2><p>${cur==='settings'?'Эти данные выводятся на всём сайте.':'Полоса с акцией под первым экраном.'}</p><div class="item" id="obj">${cur==='promo'?`<label class="full" style="display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink)"><input type="checkbox" id="pon" style="width:22px;min-height:22px" ${obj.on?'checked':''}> Показывать акцию на сайте</label>`:''}${F.map(f=>field(cur,obj,f,0)).join('')}</div><div class="row"><button class="btn b-wine" id="save">Сохранить</button></div>`;
  $('save').onclick=()=>{P.querySelectorAll('#obj [data-key]').forEach(i=>obj[i.dataset.key]=i.value);if(cur==='promo')obj.on=$('pon').checked;RC.save(D);toast()};return}
 const L=LISTS[cur],arr=D[cur];
 P.innerHTML=`<h2>${L.t}</h2><p>${L.p}</p><div id="list">${arr.map((v,i)=>`<div class="item" data-i="${i}">${L.f.map(f=>field(cur,v,f,i)).join('')}<div class="row full" style="margin:0"><button class="btn b-del" data-del="${i}">Удалить</button>${i>0?`<button class="btn b-ghost" data-up="${i}">↑ Выше</button>`:''}</div></div>`).join('')}</div><div class="row"><button class="btn b-ghost" id="add">+ Добавить</button><button class="btn b-wine" id="save">Сохранить</button></div>`;
 const collect=()=>P.querySelectorAll('#list .item').forEach(it=>{const o=arr[+it.dataset.i];it.querySelectorAll('[data-key]').forEach(i=>o[i.dataset.key]=i.value)});
 $('add').onclick=()=>{collect();arr.push(JSON.parse(JSON.stringify(L.blank)));render();P.querySelector('#list .item:last-child input,#list .item:last-child select')?.focus()};
 P.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect();arr.splice(+b.dataset.del,1);RC.save(D);render();toast('Удалено')});
 P.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{collect();const i=+b.dataset.up;[arr[i-1],arr[i]]=[arr[i],arr[i-1]];render()});
 $('save').onclick=()=>{collect();RC.save(D);toast()};
}
render();
}
</script>
</body>
</html>
