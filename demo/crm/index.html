<!doctype html>
<html lang="ru" data-tpl="salon" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Пример CRM для бизнеса | sitemaker</title>
<meta name="description" content="Живой пример CRM: записи, клиенты, заявки, склад и финансы. Можно нажимать и менять.">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--card2:#f6f8fb;--ink:#16213a;--ink2:#55607a;--ink3:#8a93a8;--line:#dfe4ec;--line2:#c9d0dc;--side:#16213a;--side-ink:#c5cde0;
  --good:#0a7d3c;--warn:#a86200;--bad:#c9302c;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--acc:#a83279;--on-acc:#fff;
  --acc-soft:color-mix(in srgb,var(--acc) 11%,var(--card));--tab:62px;--safe:env(safe-area-inset-bottom,0px)}
[data-tpl=fitness]{--acc:#2563c9}
[data-tpl=dental]{--acc:#0b7f74}
[data-theme=dark]{--bg:#0f1524;--card:#182033;--card2:#1e283e;--ink:#eef1f7;--ink2:#b3bccf;--ink3:#7f8aa3;--line:#283349;--line2:#3a4862;--side:#0b101c;--side-ink:#aab4ca;
  --good:#3fc27a;--warn:#e2a23a;--bad:#f07a74;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--acc:#e070ab;--on-acc:#1a0f18}
[data-theme=dark][data-tpl=fitness]{--acc:#5b9bf0;--on-acc:#08152b}
[data-theme=dark][data-tpl=dental]{--acc:#35b8a9;--on-acc:#04201d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
a{color:inherit}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* полоса «это пример» */
#strip{display:flex;align-items:center;gap:12px;justify-content:center;padding:8px 14px;background:var(--acc);color:var(--on-acc);font-size:14px;font-weight:500}
#strip a{flex:none;background:var(--on-acc);color:var(--acc);font-weight:700;text-decoration:none;padding:6px 14px;border-radius:999px;font-size:13.5px}
#strip .lng{display:none}

/* каркас */
#app{display:flex;min-height:calc(100dvh - 44px)}
aside{display:none}
main{flex:1;min-width:0;padding-bottom:calc(var(--tab) + var(--safe) + 24px)}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.top h1{flex:1;font-size:22px;font-weight:700;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .biz{display:block;font-size:12.5px;font-weight:500;color:var(--ink3);letter-spacing:0}
.wrap{padding:10px 16px 0;max-width:1240px}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-weight:600;white-space:nowrap;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.danger{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13.5px;border-radius:8px}
.btn.wide{width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab) + var(--safe));padding-bottom:var(--safe);background:var(--card);border-top:1px solid var(--line)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);position:relative}
.tb.on{color:var(--acc)}
.badge{background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:9px;min-width:17px;line-height:17px;padding:0 5px;text-align:center}
.tb .badge{position:absolute;top:6px;left:calc(50% + 6px)}

/* панели */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ph h2{flex:1;font-size:15.5px;font-weight:700}
.ph small{color:var(--ink3);font-size:13px}
.pb{padding:12px 16px 16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.kpi span{display:block;font-size:13px;color:var(--ink2)}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.k3 .kpi{padding:11px 10px;overflow:hidden}.k3 .kpi b{font-size:clamp(14px,4.4vw,23px)}.k3 .kpi em{font-size:11.5px}
.kpi b{display:block;font-size:clamp(18px,5.4vw,23px);font-weight:700;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap}
.kpi em{font-style:normal;font-size:12.5px;color:var(--ink3)}
.up{color:var(--good)!important}.down{color:var(--bad)!important}.warnc{color:var(--warn)!important}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);width:100%}
.row:first-child{border-top:0}
button.row:hover,.row.click:hover{background:var(--card2)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{display:block;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr{text-align:right;flex:none;font-size:13px;color:var(--ink2)}
.rr b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.time{flex:none;width:46px;font-weight:700;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--acc-soft);color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.chip.st-wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--card));border-color:transparent}
.chip.st-ok{color:var(--acc);background:var(--acc-soft);border-color:transparent}
.chip.st-done{color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card));border-color:transparent}
.chip.st-noshow,.chip.st-low{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:transparent}
.chip.st-cancel{text-decoration:line-through}
.empty{text-align:center;color:var(--ink2);padding:26px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.sg{flex:none;min-height:36px;padding:0 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sg.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sg i{font-style:normal;opacity:.65;margin-left:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.brk{flex-basis:100%;height:0}
.inp{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:76px}
.inp.sm{min-height:34px;padding:5px 8px;width:84px;text-align:right}

/* графики */
.chart{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:170px;font-size:11.5px;color:var(--ink3);text-align:right}
.yax span{line-height:1;transform:translateY(-5px)}.yax span:last-child{transform:translateY(5px)}
.plot{position:relative;height:170px;display:flex;align-items:flex-end;border-bottom:1px solid var(--line2)}
.gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.bc{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;position:relative;z-index:1;min-width:0}
.bc:hover,.bc:focus{background:color-mix(in srgb,var(--ink) 5%,transparent);outline:none}
.bar{width:62%;max-width:26px;border-radius:4px 4px 0 0;background:var(--acc);min-height:1px}
.bc.two .bar{width:36%;max-width:18px}
.bar.b1{background:var(--s1)}.bar.b2{background:var(--s2)}
.xax{grid-column:2;display:flex;font-size:11.5px;color:var(--ink3);padding-top:6px}
.xax span{flex:1;text-align:center;min-width:0;white-space:nowrap}
.xax span.on{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;align-items:center}
.hb span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-size:13.5px;font-weight:600;text-align:right}
.hb u{grid-column:1/-1;display:block;height:8px;border-radius:0 4px 4px 0;background:var(--acc);text-decoration:none;min-width:2px}
.stack{display:flex;height:14px;gap:2px;border-radius:4px;overflow:hidden;margin:6px 0 10px}
.stack i{display:block;min-width:2px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:600;color:var(--ink2);font-size:12.5px;padding:8px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right;white-space:nowrap}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover{background:var(--card2)}
.scrollx{overflow-x:auto}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--card);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.35;max-width:240px}
#tip b{display:block;font-size:14px}

/* журнал записей */
.cal{display:grid;grid-template-columns:46px 1fr;border-top:1px solid var(--line)}
.cal-sc{overflow-x:auto;grid-column:1/-1;display:grid;grid-template-columns:46px 1fr}
.cal-h{display:flex;position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line)}
.cal-hc{flex:1 0 106px;padding:10px 8px;border-left:1px solid var(--line);min-width:0}
.cal-hc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-hc small{color:var(--ink3);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-t{position:sticky;left:0;z-index:4;background:var(--card);font-size:11.5px;color:var(--ink3)}
.cal-t span{position:absolute;right:6px;transform:translateY(-7px)}
.cal-b{display:flex;position:relative}
.cal-c{flex:1 0 106px;position:relative;border-left:1px solid var(--line);cursor:cell;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,var(--line) 53px,var(--line) 54px)}
.cal-c.off{cursor:default;background:repeating-linear-gradient(135deg,var(--card2) 0 8px,var(--card) 8px 16px)}
.cal-c.off:after{content:"Выходной";position:absolute;top:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ink3)}
.bk{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;border-left:3px solid var(--acc);background:var(--acc-soft);color:var(--ink)}
.bk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk span{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.st-wait{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--card))}
.bk.st-done{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--card))}
.bk.st-noshow{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--card))}
.bk.st-cancel{border-left-color:var(--ink3);background:var(--card2);opacity:.7}
.bk.st-cancel b{text-decoration:line-through}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--bad);z-index:2;pointer-events:none}

/* воронка заявок */
.board{display:flex;gap:10px;overflow-x:auto;padding:0 16px 12px;scroll-snap-type:x mandatory;scroll-padding:16px}
.kcol{flex:0 0 82%;max-width:290px;min-width:0;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;max-height:calc(100dvh - 250px);min-height:200px}
.kcol.over{border-color:var(--acc)}
.kcol header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.kcol header b{flex:1;font-size:14.5px}
.kcol header small{color:var(--ink3);font-size:13px}
.kcards{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.kc{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;gap:8px;cursor:pointer}
.kc .rt b{white-space:normal}
.kc .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center;font-size:12.5px;color:var(--ink3)}
.kc .nx{width:32px;height:32px;border-radius:8px;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--ink2)}

/* команда */
.sched{display:grid;grid-template-columns:minmax(72px,1.4fr) repeat(7,minmax(30px,1fr));gap:3px;align-items:center;font-size:13.5px;min-width:306px}
.sched .hd{color:var(--ink3);font-size:12.5px;text-align:center}
.sched .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sh{height:34px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink3);font-size:12px}
.sh.on{background:var(--acc-soft);border-color:transparent;color:var(--acc);font-weight:700}
.sh.on:after{content:"✓"}

/* окно */
#modal{position:fixed;inset:0;z-index:60}
.m-bg{position:absolute;inset:0;background:rgba(10,16,30,.5)}
.m{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--card);border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.m-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.m-h h2{flex:1;font-size:17px;font-weight:700;min-width:0}
.m-h h2 small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.m-b{padding:16px;overflow-y:auto;padding-bottom:calc(20px + var(--safe))}
.fl{display:block;margin-bottom:12px}
.fl>span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts .btn{flex:1}
.mhint{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 25%,transparent);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.mhint span{flex:1;min-width:200px}
.mrows{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:12px}
.mr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.mr:first-child{border-top:0}
.mr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr small{color:var(--ink3);font-size:12.5px}
.mr button{flex:none;font-size:13px;font-weight:600;padding:6px 10px;border-radius:9px;background:var(--card2);color:var(--acc)}
.mr button.sent{color:var(--good);background:none}
.mbar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin:10px 0 2px}
.mbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin:2px 0 8px}
.pick{display:flex;gap:6px;flex-wrap:wrap}
.pk{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--card)}
.pk.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3 div{background:var(--card2);border-radius:10px;padding:10px}
.stat3 small{display:block;font-size:12px;color:var(--ink2)}
.stat3 b{font-size:16px;white-space:nowrap}
.note{background:var(--card2);border-radius:10px;padding:12px;font-size:14px;white-space:pre-wrap;margin-bottom:12px}
.bizpick{display:grid;gap:8px;margin:14px 0 4px}
.bizpick button{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line2);border-radius:12px;font-weight:600}
.bizpick button:hover{border-color:var(--acc)}
.bizpick small{display:block;font-weight:400;color:var(--ink2);font-size:13px}
.bizpick .dot{width:14px;height:14px;border-radius:50%;flex:none}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe) + 16px);transform:translate(-50%,16px);opacity:0;z-index:99;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.18s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.only-d,.dblock{display:none}

@media (min-width:960px){
  #strip .lng{display:inline}#strip .sht{display:none}
  .tabbar{display:none}.only-d{display:inline-flex}.dblock{display:block}.only-m{display:none!important}
  main{padding-bottom:40px}
  #strip{position:sticky;top:0;z-index:40;height:44px}
  aside{display:flex;flex-direction:column;width:236px;flex:none;background:var(--side);color:var(--side-ink);padding:18px 12px;position:sticky;top:44px;height:calc(100dvh - 44px);overflow-y:auto}
  .brand{padding:2px 10px 14px;color:#fff}
  .brand b{display:block;font-size:17px;font-weight:700;line-height:1.25}
  .brand small{font-size:12.5px;color:var(--side-ink)}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;font-weight:500;font-size:14.5px;width:100%}
  .nav:hover{background:rgba(255,255,255,.06)}
  .nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
  .nav .badge{margin-left:auto}
  .side-b{margin-top:auto;padding-top:16px;display:grid;gap:8px}
  .swt{display:grid;gap:4px;padding:8px;border-radius:12px;background:rgba(255,255,255,.06);font-size:13.5px}
  .swt>span{padding:2px 6px 4px;font-size:12.5px}
  .swt button{padding:7px 8px;border-radius:8px;display:flex;gap:8px;align-items:center;font-weight:500}
  .swt button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
  .swt i{width:9px;height:9px;border-radius:50%}
  .side-b a.cta{display:block;text-align:center;background:var(--acc);color:var(--on-acc);font-weight:700;padding:11px;border-radius:10px;text-decoration:none}
  .side-b .lnk{display:flex;gap:6px;justify-content:space-between;font-size:12.5px;padding:0 4px}
  .side-b .lnk button{text-decoration:underline;text-underline-offset:3px}

    var clash = S.bookings.filter(function (b) { return b.id !== mState.id && b.staff === nb.staff && b.date === nb.date && b.status !== 'cancel' && b.status !== 'noshow' && b.t < nb.t + nb.dur && nb.t < b.t + b.dur; })[0];
    if (clash && nb.status !== 'cancel') { err.textContent = 'В это время уже есть запись: ' + hm(clash.t) + ' – ' + hm(clash.t + clash.dur) + ' (' + clName(clash) + '). Выберите другое время.'; return; }
    if (!X.st[nb.staff].days[dow(nb.date)] && nb.status !== 'cancel') { err.textContent = X.st[nb.staff].name + ' в этот день не работает. Поменяйте день или график в разделе «Команда».'; return; }
    if (!cid) { o = { id: uid('c'), name: f.cname.value.trim().slice(0, 60), phone: fmtPh(f.cphone.value), created: TODAY, note: '' }; S.clients.push(o); cid = o.id; }
    nb.client = cid;
    if (mState.id) { o = S.bookings.filter(function (b) { return b.id === mState.id; })[0]; Object.assign(o, nb); } else { nb.id = uid('b'); S.bookings.push(nb); }
    if (mState.lead) { v = S.leads.filter(function (l) { return l.id === mState.lead; })[0]; if (v && (v.stage === 'new' || v.stage === 'talk')) v.stage = 'booked'; }
    var isNew = !mState.id; save(); closeModal(); if (view === 'cal') calDate = nb.date; render(); toast(isNew ? 'Записали на ' + fd(nb.date) + ' в ' + hm(nb.t) : 'Запись сохранена');
  } else if (f.id === 'clForm') {
    o = X.cl[mState.id]; o.name = f.name.value.trim().slice(0, 60) || o.name; o.phone = fmtPh(f.phone.value); o.note = f.note.value.trim(); save(); closeModal(); render(); toast('Сохранено');
  } else if (f.id === 'clNewForm') {
    S.clients.push({ id: uid('c'), name: f.name.value.trim().slice(0, 60), phone: fmtPh(f.phone.value), note: f.note.value.trim(), created: TODAY }); save(); closeModal(); clF = { q: '', seg: 'new' }; render(); toast('Добавили в базу');
  } else if (f.id === 'leadForm') {
    v = { name: f.name.value.trim().slice(0, 60), phone: fmtPh(f.phone.value), want: f.want.value.trim(), sum: num(f.sum.value), src: picked('src') || 'Instagram', stage: picked('stage') || 'new', note: f.note.value.trim() };
    if (mState.id) Object.assign(S.leads.filter(function (l) { return l.id === mState.id; })[0], v); else { v.id = uid('l'); v.created = TODAY; S.leads.push(v); }
    save(); closeModal(); render(); toast('Заявка сохранена');
  } else if (f.id === 'svForm') {
    v = { name: f.name.value.trim().slice(0, 80), cat: f.cat.value.trim().slice(0, 40) || 'Услуги', price: num(f.price.value), dur: Math.max(15, num(f.dur.value) || 30) };
    if (mState.id) Object.assign(X.sv[mState.id], v); else { v.id = uid('s'); S.services.push(v); }
    save(); closeModal(); render(); toast('Услуга сохранена');
  } else if (f.id === 'stForm') {
    var cats = [].map.call(document.querySelectorAll('#stCats .on'), function (x) { return x.dataset.v; });
    if (!cats.length) { $('#fErr').textContent = 'Отметьте хотя бы один раздел услуг'; return; }
    v = { name: f.name.value.trim().slice(0, 40), role: f.role.value.trim().slice(0, 40), base: num(f.base.value), pct: Math.min(100, num(f.pct.value)), cats: cats };
    if (mState.id) Object.assign(X.st[mState.id], v); else { v.id = uid('m'); v.days = [true, true, true, true, true, false, false]; S.staff.push(v); }
    save(); closeModal(); render(); toast('Сохранено');
  } else if (f.id === 'moveForm') {
    o = S.stock.filter(function (k) { return k.id === mState.id; })[0]; v = num(f.n.value) * (+f.sign.value);
    if (!v) { $('#fErr').textContent = 'Впишите количество'; return; }
    if (o.qty + v < 0) { $('#fErr').textContent = 'На складе всего ' + o.qty + ' ' + o.unit + '. Столько списать нельзя.'; return; }
    o.qty += v; S.moves.push({ id: uid('v'), date: TODAY, item: o.id, delta: v, why: f.why.value.trim() || (v > 0 ? 'Приход' : 'Расход') }); save(); closeModal(); render(); toast(o.name + ': теперь ' + o.qty + ' ' + o.unit);
  } else if (f.id === 'kForm') {
    v = { name: f.name.value.trim().slice(0, 60), unit: f.unit.value.trim().slice(0, 8) || 'шт', qty: num(f.qty.value), min: num(f.min.value), cost: num(f.cost.value) };
    if (mState.id) Object.assign(S.stock.filter(function (k) { return k.id === mState.id; })[0], v); else { v.id = uid('k'); S.stock.push(v); }
    save(); closeModal(); render(); toast('Товар сохранён');
  } else if (f.id === 'opForm') {
    v = { kind: f.kind.value, sum: num(f.sum.value), date: f.date.value || TODAY, cat: f.cat.value, note: f.note.value.trim() };
    if (!v.sum) { $('#fErr').textContent = 'Впишите сумму'; return; }
    if (mState.id) Object.assign(S.ops.filter(function (x) { return x.id === mState.id; })[0], v); else { v.id = uid('o'); S.ops.push(v); }
    save(); closeModal(); finMonth = v.date.slice(0, 7); render(); toast(v.kind === 'out' ? 'Расход записан' : 'Доход записан');
  }
});
document.addEventListener('change', function (e) {
  var t = e.target, f = t.form;
  if (t.id === 'calPick' && t.value) { calDate = t.value; render(); }
  if (f && f.id === 'bkForm') {
    if (t.name === 'client') $('#newCl').hidden = !!t.value;
    if (t.name === 'service') { var s = X.sv[t.value]; if (s) { f.price.value = s.price; f.dur.value = s.dur; } }
    if (t.name === 'staff') { var st = X.st[t.value], cur = X.sv[f.service.value]; if (st && cur && st.cats.indexOf(cur.cat) < 0) { var first = S.services.filter(function (x) { return st.cats.indexOf(x.cat) >= 0; })[0]; if (first) { f.service.value = first.id; f.price.value = first.price; f.dur.value = first.dur; } } }
    $('#bkErr').textContent = '';
  }
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'clQ') { clF.q = t.value; paintClients(); }
  if (t.id === 'mTxt' && mState && mState.kind === 'mail') { var fc = mailList(mState.id)[0]; $('#mPrev').textContent = mailFill(t.value, fc); }
  if (t.dataset.inv) { var k = S.stock.filter(function (x) { return x.id === t.dataset.inv; })[0], raw = t.value.replace(/[^\d]/g, ''); invMode[k.id] = raw === '' ? '' : +raw; document.querySelectorAll('[data-diff="' + k.id + '"]').forEach(function (d) { d.innerHTML = diffHtml(raw === '' ? null : +raw - k.qty, k.unit); }); }
});

/* перетаскивание заявок (на компьютере) */
var dragId = null;
document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.kc'); if (!c) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
document.addEventListener('dragover', function (e) { var col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.kcol.over').forEach(function (c) { if (c !== col) c.classList.remove('over'); }); col.classList.add('over'); });
document.addEventListener('drop', function (e) { var col = e.target.closest && e.target.closest('.kcol'); if (!col || !dragId) return; e.preventDefault(); var l = S.leads.filter(function (x) { return x.id === dragId; })[0]; dragId = null; if (l && l.stage !== col.dataset.stage) { l.stage = col.dataset.stage; save(); render(); } });
document.addEventListener('dragend', function () { dragId = null; document.querySelectorAll('.kcol.over').forEach(function (c) { c.classList.remove('over'); }); });

/* подсказки на графиках */
function tipShow(el, x, y) {
  var tip = $('#tip'), p = el.dataset.tip.split('|'); tip.textContent = ''; var b = document.createElement('b'); b.textContent = p[0]; tip.appendChild(b); if (p[1]) tip.appendChild(document.createTextNode(p[1]));
  tip.hidden = false; var w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - h - 12) + 'px';
}
document.addEventListener('pointermove', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType !== 'touch') tipShow(el, e.clientX, e.clientY); else $('#tip').hidden = true; });
document.addEventListener('focusin', function (e) { var el = e.target.closest && e.target.closest('.bc[data-tip]'); if (el) { var r = el.getBoundingClientRect(); tipShow(el, r.left + r.width / 2, r.top + 20); } });
document.addEventListener('focusout', function () { $('#tip').hidden = true; });
document.addEventListener('pointerdown', function (e) { var el = e.target.closest && e.target.closest('.bc[data-tip],.stack [data-tip]'); if (el && e.pointerType === 'touch') { var r = el.getBoundingClientRect(); tipShow(el, r.left + r.width / 2, r.top + 30); clearTimeout(tipShow.t); tipShow.t = setTimeout(function () { $('#tip').hidden = true; }, 2200); } });
window.addEventListener('scroll', function () { $('#tip').hidden = true; }, true);
var wide = window.innerWidth >= 960;
window.addEventListener('resize', function () { var w = window.innerWidth >= 960; if (w !== wide) { wide = w; if (!mState) render(); } });

/* ---------- старт ---------- */
document.documentElement.dataset.theme = ls.get('smdemo_theme') === 'dark' ? 'dark' : 'light';
$('#cta1').href = waUrl();
loadTpl(tplId);
render();
if (!ls.get('smdemo_seen')) {
  ls.set('smdemo_seen', 1);
  modal('Это живой пример CRM', '', '<p style="color:var(--ink2)">В такой программе бизнес ведёт записи, клиентов, заявки, склад и деньги. Здесь всё можно нажимать и менять: данные выдуманные и остаются только в вашем браузере.</p><h3 style="font-size:14.5px;margin-top:16px">Для какого бизнеса показать пример?</h3>' + bizPick(), 'hello');
}
</script>
</body>
